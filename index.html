<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Swiper</title>
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1000px 700px at 50% -10%,#10243a,#070a16 60%);color:#fff;
    min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 22px;}
  h1{font-size:40px;margin:18px 0 6px;background:linear-gradient(180deg,#fff,#9ff0e0);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  p{color:#9fb2c4;font-size:17px;max-width:520px;line-height:1.55;margin:0 0 28px;}
  .stores{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
  .store-btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    background:#000;border:1px solid rgba(255,255,255,.22);border-radius:12px;
    padding:9px 16px;min-width:150px;transition:transform .15s ease,border-color .15s ease;}
  .store-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.5);}
  .store-btn svg{width:26px;height:26px;flex:0 0 auto;}
  .store-btn .txt{display:flex;flex-direction:column;line-height:1.05;text-align:left;color:#fff;}
  .store-btn .txt small{font-size:10px;font-weight:500;letter-spacing:.5px;opacity:.85;text-transform:uppercase;}
  .store-btn .txt strong{font-size:19px;font-weight:600;}
  .store-btn.disabled{opacity:.45;cursor:default;pointer-events:none;}
  .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  a.btn{color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:16px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);}
  a.btn:hover{background:rgba(255,255,255,.18);}
  a.contact{display:inline-flex;align-items:center;gap:7px;color:#6b7d8f;text-decoration:none;
    font-size:13px;margin-bottom:34px;transition:color .15s ease;}
  a.contact:hover{color:#cfe6f2;}
  a.contact svg{width:14px;height:14px;flex:0 0 auto;opacity:.8;}
  .logo{width:104px;height:104px;border-radius:26px;object-fit:cover;display:block;
    box-shadow:0 20px 50px -12px rgba(0,200,255,.5);}
  footer{margin-top:40px;color:#5a6b7a;font-size:13px;}
</style>
</head>
<body>
  <img class="logo" src="icon.png" alt="Bill Swiper">
  <h1>Bill Swiper</h1>
  <p>Scan a restaurant bill, swipe each dish to a guest, and split the check in seconds.</p>
  <div class="stores">
    <a class="store-btn disabled" aria-disabled="true" tabindex="-1" title="Coming soon">
      <svg viewBox="0 0 384 512" fill="#fff" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="txt"><small>Download on the</small><strong>App Store</strong></span>
    </a>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.billswiper.app">
      <svg viewBox="0 0 512 512" aria-hidden="true"><path fill="#00d0ff" d="M47.6 26.9C41.1 33.7 37.3 44.3 37.3 58v396c0 13.7 3.8 24.3 10.3 31.1l1.3 1.3 221.9-221.9v-5.2L48.9 25.6z"/><path fill="#00f076" d="M344.6 334.5l-74-74v-5.2l74-74 1.7 1 87.7 49.8c25 14.2 25 37.5 0 51.8l-87.7 49.8z"/><path fill="#ff3a44" d="M346.3 333.5L270.8 258 47.6 481.2c8.2 8.7 21.8 9.8 37.1 1.1l261.6-148.8z"/><path fill="#ffc900" d="M346.3 178.5L84.7 29.7C69.4 21 55.8 22.1 47.6 30.8L270.8 254z"/></svg>
      <span class="txt"><small>Get it on</small><strong>Google Play</strong></span>
    </a>
  </div>
  <a class="contact" href="mailto:kansio.uusi@gmail.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6.5A2 2 0 0 1 5 4.5h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3.5 7l7.6 6.2a1.6 1.6 0 0 0 1.8 0L20.5 7"/></svg>
    Questions? Contact us
  </a>
  <div class="links">
    <a class="btn" href="privacy.html">Privacy Policy</a>
    <a class="btn" href="terms.html">Terms of Use</a>
  </div>
  <footer>© 2026 Bill Swiper</footer>
</body>
</html>
